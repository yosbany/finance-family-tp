version: '3.8'

services:
  # Backend API
  api:
    build: .
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      FIREBASE_DATABASE_URL: ${FIREBASE_DATABASE_URL}
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:5174,https://yosbany.github.io
      # GOOGLE_APPLICATION_CREDENTIALS is set via file mount
    volumes:
      # Mount service account credentials (must exist on host)
      - ${GOOGLE_APPLICATION_CREDENTIALS}:/app/service-account.json:ro
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /app/service-account.json
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # Reverse proxy (Nginx) - optional for local development
  # In production, use the system's Nginx/Caddy
  nginx:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8443:443"
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # Self-signed cert for local development (optional)
      # - ./certs:/etc/nginx/certs:ro
    depends_on:
      - api
    restart: unless-stopped
