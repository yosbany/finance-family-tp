# Nginx configuration for service.nrdonline.site
# This file should be placed in /etc/nginx/sites-available/ or /etc/nginx/conf.d/

# Upstream backend
upstream finance_backend {
    server 127.0.0.1:8030;
    keepalive 32;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name service.nrdonline.site;

    # Certbot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name service.nrdonline.site;

    # SSL Certificate paths (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/service.nrdonline.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/service.nrdonline.site/privkey.pem;

    # SSL Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Logging
    access_log /var/log/nginx/service.nrdonline.site.access.log;
    error_log /var/log/nginx/service.nrdonline.site.error.log;

    # Limits
    client_max_body_size 10M;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;

    # Health check endpoint (public, no auth required)
    location /health {
        proxy_pass http://finance_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        access_log off;
    }

    # API endpoints (protected by Firebase auth)
    location /api {
        proxy_pass http://finance_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;

        # CORS headers are handled by backend
        # Nginx just forwards them through
    }

    # Deny everything else
    location / {
        return 404;
    }
}
